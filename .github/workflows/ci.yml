name: CI

on:
  push:
    branches: [andres, main, develop]
  pull_request:
    branches: [andres, main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build (production mode, no demo data)
        env:
          VITE_API_URL: http://localhost:3001
          VITE_ENABLE_DEMO_DATA: 'false'
          VITE_ENABLE_DEMO_AUTH: 'false'
        run: npm run build
